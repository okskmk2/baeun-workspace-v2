runtime: nodejs24
instance_class: F2

handlers:
  - url: /.*
    secure: always
    redirect_http_response_code: 301
    script: auto

automatic_scaling:
  max_instances: 3
  min_instances: 1
  target_cpu_utilization: 0.6
  min_pending_latency: 30ms
  max_pending_latency: 10s

resources:
  cpu: 1
  memory_gb: 0.5
  disk_size_gb: 10
