runtime: nodejs24
instance_class: F1  # F2에서 F1으로 낮춰 기본 비용 50% 절감

handlers:
  - url: /.*
    secure: always
    redirect_http_response_code: 301
    script: auto

automatic_scaling:
  max_instances: 3
  min_instances: 0  # 트래픽 없으면 인스턴스를 꺼서 0원 달성
  target_cpu_utilization: 0.8  # CPU를 더 꽉 채워 쓰도록 유도
  min_pending_latency: 30ms
  max_pending_latency: 10s